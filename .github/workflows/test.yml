name: test

on:
  push:
  pull_request:

jobs:
  forge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - name: Prebuild PoolManager
        run: forge build lib/v4-core/src/PoolManager.sol
      - name: Test
        run: forge test -vv
